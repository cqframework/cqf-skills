name: Release check

# Weekly: for every skill with a scripts/check_release.py, compare the versions the skill is pinned
# to with the latest upstream releases. If any is newer, open (or update) one issue per skill,
# labelled "<skill>-release", listing the citations a re-pin must re-read. Re-pinning itself stays
# a reviewed pull request.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  find:
    runs-on: ubuntu-latest
    outputs:
      skills: ${{ steps.list.outputs.skills }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          skills=$(ls skills/*/scripts/check_release.py | cut -d/ -f2 | jq -R . | jq -sc .)
          echo "skills=$skills" >> "$GITHUB_OUTPUT"

  check:
    needs: find
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        skill: ${{ fromJson(needs.find.outputs.skills) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compare pins with latest releases
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          python "skills/${{ matrix.skill }}/scripts/check_release.py" --cache "$RUNNER_TEMP/cache" --report "$RUNNER_TEMP/report.md"
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = 1 ]; then exit 1; fi
      - name: Open or update the release issue
        if: steps.check.outputs.code == '3'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKILL: ${{ matrix.skill }}
        run: |
          label="$SKILL-release"
          gh label create "$label" --color FBCA04 --description "A source the $SKILL skill is pinned to has a newer release" --force
          {
            cat "$RUNNER_TEMP/report.md"
            echo
            echo "_Checked by [this workflow run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})._"
          } > "$RUNNER_TEMP/body.md"
          number=$(gh issue list --label "$label" --state open --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file "$RUNNER_TEMP/body.md"
          else
            gh issue create --title "$SKILL: newer upstream release to re-pin" --label "$label" --body-file "$RUNNER_TEMP/body.md"
          fi
